<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIBERO AutoDAgger</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101821;color:#e8edf3}body{max-width:1280px;margin:28px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}small,.muted{color:#9aaebe}.badge{padding:8px 16px;border-radius:20px;background:#214851}.teacher{background:#69401e;color:#ffcd85}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#192531;border:1px solid #2c3c4c;border-radius:12px;padding:18px;margin-top:18px}.camera{width:100%;max-height:340px;object-fit:contain;background:#080e15;image-rendering:auto}.metrics{display:flex;gap:25px;flex-wrap:wrap}.metrics strong{font-size:24px;display:block}canvas{width:100%;height:210px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #30404f}button{background:#28465b;color:#e8edf3;border:0;padding:6px 12px;border-radius:5px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}#error{color:#ffaf9d}#connection{font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}td,th{padding:6px}}
</style></head><body>
<header><div><h1>LIBERO AutoDAgger</h1><small>只读采集监控 · SmolVLA → openpi</small></div><span id="actor" class="badge">等待采集</span></header>
<p><a href="/player.html" style="color:#70d1ca">打开轨迹播放器</a></p><p id="connection">正在连接…</p><p id="test-notice" style="color:#ffcd85"></p><h2 id="task">等待任务</h2><p id="position" class="muted"></p><p id="error"></p>
<div class="grid"><section class="card"><small>主相机</small><img class="camera" id="image" alt="主相机实时画面"></section><section class="card"><small>腕部相机</small><img class="camera" id="image2" alt="腕部相机实时画面"></section></div>
<section class="card metrics" id="metrics"></section>
<div class="grid"><section class="card"><h3>任务进度</h3><canvas id="progress"></canvas></section><section class="card"><h3>成功概率 · 虚线为阈值</h3><canvas id="success"></canvas></section></div>
<p class="muted" id="coverage"></p><p id="takeover-reason" style="color:#ffcd85" aria-live="polite">接管原因：未接管</p><section class="card"><h3>采集统计</h3><div id="stats" class="metrics"></div></section>
<section class="card"><h3>最近 episode</h3><table><thead><tr><th>Episode</th><th>接管原因／步号</th><th>筛选通过</th><th>环境成功</th><th>保存状态</th><th></th></tr></thead><tbody id="episodes"></tbody></table></section>
<section class="card"><h3 id="detail-title">当前 episode 分数与元数据</h3><button id="live">返回实时曲线</button><pre id="detail">请选择历史 episode 查看详情。</pre></section>
<script>
const $=id=>document.getElementById(id);let history=null,busy=false;
// Share labels across live status, historical curves and the episode table.
function takeoverText(episode){
  if(episode.takeover_step===null||episode.takeover_step===undefined)return '未接管';
  const labels={progress_stalled:'进度停滞',progress_regression:'进度持续退步',forced_test:'强制接管（测试）'};
  const reason=labels[episode.takeover_reason]||episode.takeover_reason||'原因未记录';
  return reason+' · step '+episode.takeover_step;
}
function chart(id,samples,key,threshold,takeover){let c=$(id),d=devicePixelRatio||1,w=c.clientWidth,h=210;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,w,h);let left=36,right=w-12,top=12,bottom=h-25,maxStep=Math.max(1,...samples.map(s=>s.step)),values=samples.map(s=>s[key]);let lo=Math.min(0,...values),hi=Math.max(1,...values);const px=v=>left+v/maxStep*(right-left),py=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);x.font='11px system-ui';x.fillStyle='#9aaebe';x.strokeStyle='#344555';for(let i=0;i<=4;i++){let v=lo+(hi-lo)*i/4;x.beginPath();x.moveTo(left,py(v));x.lineTo(right,py(v));x.stroke();x.fillText(v.toFixed(2),0,py(v)+4)}x.fillText('0',left,bottom+17);x.fillText(maxStep+' steps',Math.max(left,right-70),bottom+17);if(threshold!==null){x.setLineDash([5,5]);x.strokeStyle='#c5b776';x.beginPath();x.moveTo(left,py(threshold));x.lineTo(right,py(threshold));x.stroke();x.setLineDash([])}if(takeover!==null&&takeover!==undefined){x.strokeStyle='#ffaa55';x.beginPath();x.moveTo(px(takeover),top);x.lineTo(px(takeover),bottom);x.stroke();x.fillStyle='#ffaa55';x.fillText('teacher',Math.min(px(takeover)+3,right-45),top+12)}x.strokeStyle='#70d1ca';x.lineWidth=2;x.beginPath();samples.forEach((s,i)=>i?x.lineTo(px(s.step),py(s[key])):x.moveTo(px(s.step),py(s[key])));x.stroke()}
function metric(parent,label,value){let item=document.createElement('div'),small=document.createElement('small'),strong=document.createElement('strong');small.textContent=label;strong.textContent=value;item.append(small,strong);parent.append(item)}
async function get(url){let r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function update(){if(busy)return;busy=true;try{let [s,episodes]=await Promise.all([get('/api/state'),get('/api/episodes')]);$('connection').textContent='已连接 · '+new Date().toLocaleTimeString();$('task').textContent=s.task||'等待任务';$('actor').textContent=s.actor||s.status;$('actor').className='badge '+(s.actor==='teacher'?'teacher':'');$('position').textContent=[s.suite,s.episode_id,'step '+(s.step||0),s.status].filter(Boolean).join(' · ');$('error').textContent=s.error||'';for(let name of ['image','image2'])$(name).src='/frames/'+name+'.jpg?t='+Date.now();let a=s.samples||[],last=a.at(-1);$('metrics').replaceChildren();metric($('metrics'),'Progress',last?last.progress.toFixed(3):'—');metric($('metrics'),'成功概率',last?last.success_probability.toFixed(3):'—');metric($('metrics'),'策略耗时',s.policy_latency_ms?Math.round(s.policy_latency_ms)+' ms':'—');metric($('metrics'),'评分耗时',last?Math.round(last.latency_ms)+' ms':'—');let view=history||s,ss=view.samples||[];$('takeover-reason').textContent=(history?'历史 '+history.episode_id+' 接管原因：':'实时接管原因：')+takeoverText(view);chart('progress',ss,'progress',null,view.takeover_step);chart('success',ss,'success_probability',s.success_threshold,view.takeover_step);$('coverage').textContent=(history?'历史 '+history.episode_id:'实时')+' · 评分覆盖到 step '+(ss.at(-1)?.step??'—')+' · 橙线为 teacher 接管';$('stats').replaceChildren();for(let [key,label] of [['completed','已完成'],['takeover_rate','接管率'],['acceptance_rate','筛选通过率'],['env_success_rate','环境成功率'],['disagreement_rate','判定分歧']])metric($('stats'),label,key==='completed'?s.statistics[key]:(100*s.statistics[key]).toFixed(1)+'%');$('episodes').replaceChildren();for(let e of episodes){let tr=document.createElement('tr');for(let v of [e.episode_id,takeoverText(e),e.accepted_for_distillation?'是':'否',e.env_success?'是':'否',e.end_reason==='interrupted'?'已保存 · 中断':'已保存']){let td=document.createElement('td');td.textContent=v;tr.append(td)}let td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=async()=>{try{history=await get('/api/episodes/'+encodeURIComponent(e.episode_id));$('detail').textContent=JSON.stringify(history,null,2);$('detail-title').textContent='历史 '+e.episode_id}catch(err){$('error').textContent=String(err)}};td.append(b);let link=document.createElement('a');link.textContent=' 播放';link.href='/player.html?episode='+encodeURIComponent(e.episode_id);link.style.color='#70d1ca';td.append(link);tr.append(td);$('episodes').append(tr)}}catch(e){$('connection').textContent='连接中断，自动重试…';$('error').textContent=String(e)}finally{busy=false}}
$('live').onclick=()=>{history=null;$('detail-title').textContent='当前 episode 分数与元数据';$('detail').textContent='请选择历史 episode 查看详情。'};
const originalGet=get;get=async function(url){const data=await originalGet(url);if(url==='/api/state')$('test-notice').textContent=(data.test_only?'测试运行 · 不计入正式统计':'')+(data.score_source==='simulated'?' · 模拟评分器：不代表 Robometer 结果':'');return data};
setInterval(update,500);update();
</script></body></html>
